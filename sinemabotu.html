<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinema Botu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech&display=swap');
        
@media (max-width: 600px) {
    #main-container {
        width: 90vw !important; 
        max-width: 350px;      
        height: auto !important;
        min-height: 500px;
        flex-direction: column !important;
        border-radius: 20px !important;
        margin: 20px auto !important;
        padding: 15px !important;
        box-shadow: 0px 10px 30px rgba(0,0,0,0.5) !important;
    }

    #point-container {
        width: 100% !important;
        height: auto !important;
        flex-direction: column !important;
        padding: 10px 0 !important;
    }

    #slider {
        rotate: 0deg !important; 
        transform: none !important;
        width: 100% !important; 
        margin: 20px 0 !important;
    }

    #point-container div {
        transform: none !important;
        position: static !important;
        margin: 5px 0 !important;
    }

    #category-container {
        grid-template-columns: repeat(3, 1fr) !important; 
        gap: 25px !important;
        margin: 10px 0 !important;
        width: 100% !important;
        justify-content: center;
        align-items: center;
        display: flex;
    }

    .category {
        width: 115% !important; 
        height: 100px !important;
    }

    .category img {
        width: 60px !important;
        height: 60px !important;
        top: 15px !important;
    }

    .category h4 {
        font-size: 0.8rem !important;
    }

    #result-container {
        flex-direction: column !important;
        width: 100% !important;
    }

    #result-container img {
        width: 100% !important;
        max-width: 320px; 
        height: auto !important;
        border-radius: 15px !important;
        border: 3px solid #eee !important;
    }

    #right-section {
        width: 100% !important;
        text-align: center;
        justify-content: center;
        align-items: center;
        padding: 10px 0 !important;
    }

    #right-section h2 {
        font-size: 1.3rem !important;
        margin-top: 10px !important;
    }

    #summary {
        height: auto !important;
        overflow-y: auto;
        font-size: 0.8rem !important;
    }
}
        body {
            background-color: black;
        }

        *{
            color: white;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        #main-container {
            margin: 20px auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #0B0E14;
            width: 35rem;
            height: 34em;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 0 42px 42px 0;
            transition: 0.5s ease-in-out;
            box-shadow: 0px 0px 0px 0px #ffffff;}

        #search-container {
            display: flex;  
        }

        #category-container{
            margin: auto 2rem;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,1fr);
            gap: 2rem;
        }

        .category {
            background-color: #1A1F29;
            height: 8rem;
            width: 8rem;
            border-radius: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        
        .category img {
            filter: grayscale(80%);
            margin-top : -0.6rem;
            justify-self: center;
            width: 5rem;
            height: 5rem;
            position: absolute;
            top: 1.5rem;
            transition: 0.3s ease-in-out;
        }

        .category:hover img {
            filter: grayscale(13%);
            transform: scale(1.1);
            transition: 0.3s ease-in-out;
        }

        .category h4 {
            width: 100%;
            padding: 0.2rem;
            text-align: center;
            border-radius: 0 0 20px 20px;
            font-family: "Share Tech Mono", monospace;
            font-size: 1rem;
        }

        #point-container {
            background-color: #11141c;
            width: 3.5rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            font-family: "Share Tech Mono", monospace;
        }

        #point-container div{
            margin-top: 1.5rem;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.7rem;
            transform: translateY(12.5rem);
        }
        
        #slider {
            -webkit-appearance: none;
            appearance: none;
            margin-top: 2rem;
            width: 27rem; 
            height: 1rem;
            background: #444;
            outline: none;
            border-radius: 14px;
            cursor: pointer;
            rotate: -90deg;
            padding: 0;
            --thumb-glow: 0px;
            --thumb-color: rgb(238, 203, 0);
        }

        #slider::-webkit-slider-thumb {
            -webkit-appearance: none; 
            appearance: none;
            rotate: 90deg;
            width: 3.5rem;  
            height: 3.5em; 
            background-image: url('https://cdn-icons-png.flaticon.com/512/2107/2107957.png'); 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent; 
            border: none; 
            cursor: pointer;
            filter: drop-shadow(0 0 var(--thumb-glow) var(--thumb-color));
            transition: filter 0.2s ease; 
        }

        .super-charge::-webkit-slider-thumb {
            animation: star-shake-new 0.1s infinite linear !important;
            filter: drop-shadow(0 0 30px #ffffff) brightness(1.8) !important;
            transition: none !important;
        }

        @keyframes star-shake-new {
            0% { margin-top: 0px; margin-left: 0px; }
            25% { margin-top: -3px; margin-left: 3px; }
            50% { margin-top: 3px; margin-left: -3px; }
            75% { margin-top: -2px; margin-left: -2px; }
            100% { margin-top: 0px; margin-left: 0px; }
        }

        #result-container {
            width:100%;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: rgb(255, 255, 255);
            transition: 0.5s ease-in-out;
        }

        #result-container img {
            width: 17rem;
            height: 100%;
            border: 5px solid rgb(255, 255, 255);
            border-radius: 0 30px 30px 0;
        }

        #right-section h2,p{
            color: rgb(255, 255, 255);
            font-family: 'Share Tech', monospace;
        }

        #right-section h2 {
            margin-top: 3rem;
            font-size: 1.9rem;
        }

        #right-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-right: 1rem ;
            padding: 0.1rem;
            width: 15rem;
            height: 100%;
        }

        #second-section {
            display: flex;
            gap: 1rem;
        }

        #summary{
            font-size: .7rem;
            margin-top: 0.7rem;
            margin-bottom: 1.3rem;
            height: 100%; 
            overflow: hidden;
        }

        #newQuery-btn{
            margin: auto auto 1.5rem auto;
            text-align: center;
            border: none;
            width: 140px;
            height: 50px;
            color: #fff;
            z-index: 1;
            display: flex;
            background: #b1b1b1;
            position: relative;
            cursor: pointer;}

        #newQuery-btn p {
            margin: 0 auto;
            align-self: center;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            color: white;
            }

        #newQuery-btn::after {
            position: absolute;
            content: "";
            width: 100%;
            z-index: -1;
            height: 10%;
            bottom: 0;
            clip-path: polygon(
                0% 74%,
                4% 75%,
                8% 76%,
                11% 77%,
                15% 78%,
                20% 78%,
                25% 77%,
                32% 77%,
                37% 75%,
                40% 74%,
                43% 74%,
                46% 73%,
                52% 72%,
                57% 72%,
                65% 74%,
                66% 75%,
                71% 78%,
                75% 82%,
                81% 86%,
                83% 88%,
                88% 91%,
                90% 94%,
                94% 96%,
                98% 98%,
                100% 100%,
                82% 100%,
                0 100%
            );
            background: #747474;
            transition: 0.2s ease;
            }

        #newQuery-btn::before {
            position: absolute;
            content: "";
            transform: rotate(180deg);
            width: 100%;
            height: 10%;
            transition: 0.2s ease;
            z-index: -1;
            clip-path: polygon(
                0% 74%,
                4% 75%,
                8% 76%,
                11% 77%,
                15% 78%,
                20% 78%,
                25% 77%,
                32% 77%,
                37% 75%,
                40% 74%,
                43% 74%,
                46% 73%,
                52% 72%,
                57% 72%,
                65% 74%,
                66% 75%,
                71% 78%,
                75% 82%,
                81% 86%,
                83% 88%,
                88% 91%,
                90% 94%,
                94% 96%,
                98% 98%,
                100% 100%,
                82% 100%,
                0 100%
            );
            background: #cccccc;
            }

        #newQuery-btn:hover::after {
            clip-path: polygon(
                0 30%,
                9% 34%,
                7% 39%,
                11% 43%,
                13% 33%,
                17% 30%,
                24% 34%,
                25% 35%,
                30% 31%,
                30% 38%,
                39% 33%,
                35% 43%,
                43% 45%,
                55% 46%,
                65% 74%,
                67% 66%,
                81% 57%,
                75% 82%,
                81% 86%,
                83% 88%,
                88% 91%,
                90% 94%,
                94% 96%,
                98% 98%,
                100% 100%,
                82% 100%,
                0 100%
            );
            height: 80%;
            }

        #newQuery-btn:hover::before {
            clip-path: polygon(
                0 30%,
                9% 34%,
                7% 39%,
                11% 43%,
                13% 33%,
                17% 30%,
                24% 34%,
                25% 35%,
                30% 31%,
                30% 38%,
                39% 33%,
                35% 43%,
                43% 45%,
                55% 46%,
                65% 74%,
                67% 66%,
                81% 57%,
                75% 82%,
                81% 86%,
                83% 88%,
                88% 91%,
                90% 94%,
                94% 96%,
                98% 98%,
                100% 100%,
                82% 100%,
                0 100%
            );
            height: 80%;
            }
        
        .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        button.category { font: inherit; color: inherit; }
        #tmdb-key { max-width: 10rem; }
        #status { min-height: 1.3em; margin: .35em 0; }
        #main-container.showing-film { height: 22rem; width: 34rem; max-width: 90vw; background: white; box-shadow: 22px 13px 150px 3px white; }
        .showing-film #right-section h2, .showing-film #right-section p:not(#category) { color: #222; }
        .showing-film #newQuery-btn p { color: white; }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="point-container">
            <label for="slider" class="visually-hidden">Asgari TMDB puanı</label>
            <input type="range" id="slider" min="1" max="9" value="1" step="0.5">
            <div id="point">1</div>
        </div>
        <div id="search-container">
            <label for="tmdb-key">TMDB v3 API anahtarı</label>
            <input id="tmdb-key" type="password" autocomplete="off" spellcheck="false">
            <p id="status" role="status"></p>
            <div id="category-container">
                <button class="category" type="button" data-id="28"><img src="https://cdn-icons-png.flaticon.com/512/3857/3857467.png" alt=""><h4>Aksiyon</h4></button>
                <button class="category" type="button" data-id="53"><img src="https://cdn-icons-png.flaticon.com/512/188/188568.png" alt=""><h4>Gerilim</h4></button>
                <button class="category" type="button" data-id="35"><img src="https://cdn-icons-png.flaticon.com/512/8468/8468485.png" alt=""><h4>Komedi</h4></button>
                <button class="category" type="button" data-id="18"><img src="https://cdn-icons-png.flaticon.com/512/1049/1049352.png" alt=""><h4>Dram</h4></button>
                <button class="category" type="button" data-id="10749"><img src="https://cdn-icons-png.flaticon.com/512/11009/11009785.png" alt=""><h4>Romantik</h4></button>
                <button class="category" type="button" data-id="10752"><img src="https://cdn-icons-png.flaticon.com/512/861/861908.png" alt=""><h4>Savaş</h4></button>
                <button class="category" type="button" data-id="878"><img src="https://cdn-icons-png.flaticon.com/512/620/620689.png" alt=""><h4>Bilim-Kurgu</h4></button>
                <button class="category" type="button" data-id="16"><img src="https://cdn-icons-png.flaticon.com/512/891/891948.png" alt=""><h4>Animasyon</h4></button>
                <button class="category" type="button" data-id="80"><img src="https://cdn-icons-png.flaticon.com/512/8858/8858927.png" alt=""><h4>Suç</h4></button>
            </div>
        </div>
        <div id="result-container">
            <div id="left-section"><img alt=""></div>
            <div id="right-section">
                <h2 id="movie-name"></h2>
                <div id="second-section"><p id="director"></p><p></p><p id="category" style="color: red;">Dram</p></div>
                <p id="summary"></p>
                <button id="newQuery-btn"><p>Yeniden Arat</p></button>
        </div>
    </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
